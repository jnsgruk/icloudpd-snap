name: Update

on:
  # Runs at 10:00 UTC every day
  schedule:
    - cron: "0 10 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync version with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Sync Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST=$(gh api repos/icloud-photos-downloader/icloud_photos_downloader/releases/latest \
            --jq '.tag_name')
          LATEST=${LATEST#v}

          if [[ ! "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid upstream release version: '$LATEST'"
            exit 1
          fi

          sed -i "s/^version: .*/version: $LATEST/" snap/snapcraft.yaml
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes detected"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup LXD
        if: ${{ steps.changes.outputs.updated == 'true' }}
        uses: canonical/setup-lxd@v1

      - name: Ensure snap builds
        if: ${{ steps.changes.outputs.updated == 'true' }}
        run: |
          sudo snap install --classic snapcraft
          snapcraft pack --verbose

      - name: Commit changes
        if: ${{ steps.changes.outputs.updated == 'true' }}
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump icloudpd to version ${{ steps.version.outputs.version }}"
          git push

      - name: Open issue if failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            title="Auto-update to version \`$VERSION\` failed"
          else
            title="Automatic version update failed"
          fi

          gh issue create --title "$title" --body "The automatic update workflow failed. See: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} for details."
